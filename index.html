<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f5f6f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12151f" media="(prefers-color-scheme: dark)">
<meta name="application-name" content="도전! 골든벨">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="골든벨">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="description" content="초등학생 골든벨 700문항 퀴즈 앱">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<style>
/* base reset (same role as the claude.ai page skeleton) */
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{-webkit-text-size-adjust:100%}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>도전! 골든벨 700</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@400;500;700&family=Gowun+Batang:wght@700&display=swap">
<style>
/* Layout: one-screen phone app. Quiet paper ground, ink type, a single brass accent reserved for the bell and the primary action. */
:root{
  --bg:#f5f6f8; --card:#ffffff; --fg:#161b2e; --muted:#6b7183; --line:#e1e4ea; --line-strong:#c9cdd6;
  --ink:#161b2e; --ink-fg:#ffffff; --brass:#9c7a1c; --brass-soft:#f3ecd8; --tint:#eef0f5;
  --ok:#2e7d4f; --ok-soft:#e6f2ea; --no:#b3402f; --no-soft:#f7e6e2;
  --display:'Gowun Batang','Apple SD Gothic Neo','Malgun Gothic',serif;
  --body:'Gothic A1','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12151f; --card:#1b1f2c; --fg:#eceef4; --muted:#9499ab; --line:#2b3040; --line-strong:#3c4256;
  --ink:#eceef4; --ink-fg:#12151f; --brass:#d2b25a; --brass-soft:#2c2816; --tint:#222738;
  --ok:#5cc08a; --ok-soft:#1b2e24; --no:#e5796a; --no-soft:#3a2420; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12151f; --card:#1b1f2c; --fg:#eceef4; --muted:#9499ab; --line:#2b3040; --line-strong:#3c4256;
  --ink:#eceef4; --ink-fg:#12151f; --brass:#d2b25a; --brass-soft:#2c2816; --tint:#222738;
  --ok:#5cc08a; --ok-soft:#1b2e24; --no:#e5796a; --no-soft:#3a2420; color-scheme:dark}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.6;letter-spacing:-.01em;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
*{box-sizing:border-box}
[hidden]{display:none!important}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer;border:0;background:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:700;margin:0;text-wrap:balance;letter-spacing:-.02em}
svg.i{width:1em;height:1em;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none;display:inline-block;vertical-align:-.15em}
.app{height:100%;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:8px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-height:56px;border-bottom:1px solid var(--line)}
.top h2{font-size:18px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--body);font-weight:600}
.iconbtn{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;font-size:20px;color:var(--fg);flex:none}
.iconbtn:active{background:var(--tint)}
.stage{flex:1;overflow-y:auto;padding-block:16px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
.card{background:var(--card);border-radius:14px;padding:18px;border:1px solid var(--line)}
.muted{color:var(--muted);font-size:14px}
.lbl{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.sep{height:1px;background:var(--line)}

/* home */
.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;padding-block:8px 4px}
.hero .eyebrow{font-size:12px;letter-spacing:.14em;color:var(--brass);font-weight:600;margin-bottom:6px}
.hero h1{font-size:38px;line-height:1.12}
.hero .sub{color:var(--muted);font-size:13px;margin-top:8px;word-break:keep-all}
.hero .bell{width:52px;height:52px;color:var(--brass);flex:none;margin-bottom:6px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:14px;background:var(--card);overflow:hidden}
.stat{padding:12px 8px;text-align:center}
.stat+.stat{border-left:1px solid var(--line)}
.stat b{display:block;font-family:var(--display);font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.stat span{font-size:12px;color:var(--muted)}
.modes{display:flex;flex-direction:column;gap:10px}
.mode{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;text-align:left;display:grid;grid-template-columns:40px 1fr auto;align-items:center;gap:14px;transition:background .12s}
.mode:active{background:var(--tint)}
.mode .ic{width:40px;height:40px;border-radius:10px;background:var(--tint);display:grid;place-items:center;font-size:20px;color:var(--fg)}
.mode .nm{display:block;font-weight:700;font-size:17px}
.mode .ds{display:block;font-size:13px;color:var(--muted);line-height:1.4;margin-top:2px}
.mode .arr{color:var(--muted);font-size:18px}
.mode.gold{background:var(--ink);color:var(--ink-fg);border-color:var(--ink)}
.mode.gold .ic{background:var(--brass);color:#161b2e}
.mode.gold .ds,.mode.gold .arr{color:var(--ink-fg);opacity:.7}
.mode .cnt{font-size:12px;color:var(--brass);font-weight:600;margin-left:6px;font-variant-numeric:tabular-nums}
.credit{font-size:12px;color:var(--muted);text-align:center;line-height:1.5}
.linkbtn{font-size:13px;color:var(--muted);text-decoration:underline;text-underline-offset:3px;align-self:center;margin:0 auto;padding:6px}

/* setup */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 14px;border-radius:999px;background:transparent;border:1px solid var(--line-strong);font-size:14px;font-weight:500;color:var(--fg)}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--ink-fg)}
.setrow{display:flex;flex-direction:column;gap:10px}
.cta{display:block;width:100%;padding:15px;border-radius:12px;background:var(--ink);color:var(--ink-fg);font-weight:600;font-size:17px;transition:opacity .12s}
.cta:active{opacity:.85}
.cta.brass{background:var(--brass);color:#161b2e}
.cta.ghost{background:transparent;color:var(--fg);border:1px solid var(--line-strong)}
.cta[disabled]{opacity:.45;pointer-events:none}
.btnrow{display:flex;flex-direction:column;gap:10px}

/* quiz */
.qhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.qhead .sub{font-weight:600;color:var(--fg)}
.qhead .dot{width:3px;height:3px;border-radius:50%;background:var(--line-strong)}
.qhead .cnt{margin-left:auto;font-variant-numeric:tabular-nums}
.lives{display:flex;gap:5px;margin-left:auto;align-items:center}
.lives i{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--brass);display:block}
.lives i.on{background:var(--brass)}
.prog{height:3px;border-radius:2px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:var(--brass);width:0;transition:width .3s}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px}
.qnum{font-size:12px;letter-spacing:.08em;color:var(--brass);font-weight:600;margin-bottom:10px;text-transform:uppercase}
.qtext{font-size:19px;line-height:1.55;font-weight:500}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:12px;background:var(--card);border:1px solid var(--line-strong);text-align:left;font-size:16px;line-height:1.4;color:var(--fg)}
.opt .k{flex:none;width:26px;height:26px;border-radius:50%;border:1px solid var(--line-strong);color:var(--muted);display:grid;place-items:center;font-size:12px;font-weight:600}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.ok .k{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.no{border-color:var(--no);background:var(--no-soft)}
.opt.no .k{background:var(--no);border-color:var(--no);color:#fff}
.opt[disabled]{pointer-events:none}
.ox{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ox button{padding:22px 0;border-radius:12px;font-family:var(--display);font-size:44px;line-height:1;background:var(--card);border:1px solid var(--line-strong);color:var(--fg);display:flex;flex-direction:column;align-items:center;gap:6px}
.ox button small{font-family:var(--body);font-size:12px;color:var(--muted);letter-spacing:.08em}
.ox button.ok{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.ox button.no{border-color:var(--no);background:var(--no-soft);color:var(--no)}
.ox button[disabled]{pointer-events:none}
.inputrow{display:flex;gap:8px}
.inputrow input{flex:1;min-width:0;font-size:18px;padding:12px 14px;border-radius:12px;border:1px solid var(--line-strong);background:var(--card);color:var(--fg);font-family:inherit}
.inputrow input::placeholder{color:var(--muted)}
.inputrow button{padding:0 18px;border-radius:12px;background:var(--ink);color:var(--ink-fg);font-weight:600;font-size:15px}
.subrow{display:flex;gap:8px;flex-wrap:wrap}
.small{padding:8px 12px;border-radius:10px;border:1px solid var(--line-strong);font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:6px;color:var(--fg)}
.small[disabled]{opacity:.4;pointer-events:none}
.hint{font-family:var(--display);font-size:22px;letter-spacing:.25em;color:var(--brass);padding:4px 2px}
.fb{border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:6px;border:1px solid}
.fb.ok{background:var(--ok-soft);border-color:var(--ok)}
.fb.no{background:var(--no-soft);border-color:var(--no)}
.fb h3{font-size:18px;font-family:var(--body);display:flex;align-items:center;gap:8px}
.fb.ok h3{color:var(--ok)}.fb.no h3{color:var(--no)}
.fb .ans{font-size:16px}
.fb .ans b{font-weight:600}
.fb .exp{color:var(--muted);font-size:14px;line-height:1.5}
.selfgrade{display:flex;gap:10px;margin-top:6px;align-items:center;flex-wrap:wrap}
.selfgrade .mine{flex:1;min-width:0;font-size:14px;color:var(--muted)}
.selfgrade button{padding:8px 12px;border-radius:10px;border:1px solid var(--line-strong);background:var(--card);font-size:13px;font-weight:500;color:var(--fg)}
.bottom{position:sticky;bottom:0;padding-top:10px;background:linear-gradient(transparent,var(--bg) 35%);margin-top:auto}

/* result */
.score{text-align:center;padding-block:14px}
.score .big{font-family:var(--display);font-size:56px;line-height:1;font-variant-numeric:tabular-nums}
.score .big small{font-size:22px;color:var(--muted)}
.score .bellbig{width:56px;height:56px;color:var(--brass);margin:0 auto 10px;display:block}
.score .msg{font-weight:600;font-size:18px;margin-top:10px}
.score .tag{display:inline-block;margin-top:10px;font-size:12px;letter-spacing:.08em;color:var(--brass);font-weight:600;border:1px solid var(--brass);border-radius:999px;padding:4px 10px}
.bars{display:flex;flex-direction:column;gap:10px}
.bar{display:grid;grid-template-columns:64px 1fr 44px;gap:10px;align-items:center;font-size:13px}
.bar i{display:block;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i b{display:block;height:100%;background:var(--ink)}
.bar span:last-child{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.wronglist{display:flex;flex-direction:column;gap:8px}
.wrongitem{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:14px;line-height:1.5}
.wrongitem .a{color:var(--ok);font-weight:600;margin-top:4px}
.wrongitem .m{color:var(--muted);font-size:12px;letter-spacing:.04em}

/* vs */
.vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;text-align:center}
.vs .p{background:var(--card);border-radius:12px;padding:10px;border:1px solid var(--line)}
.vs .p.turn{border-color:var(--brass);box-shadow:inset 0 0 0 1px var(--brass)}
.vs .p b{display:block;font-family:var(--display);font-size:28px;font-weight:600;line-height:1.1}
.vs .p span{font-size:12px;color:var(--muted)}
.vs em{font-style:normal;color:var(--muted);font-size:12px;letter-spacing:.1em}
.turnbanner{text-align:center;font-weight:600;font-size:16px;padding:12px;border-radius:12px;background:var(--brass-soft);color:var(--fg);border:1px solid var(--brass)}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--ink-fg);padding:10px 16px;border-radius:10px;font-size:14px;font-weight:500;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20;white-space:nowrap}
.toast.show{opacity:1}
.shake{animation:shake .3s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.pop{animation:pop .25s}
@keyframes pop{0%{opacity:.4;transform:translateY(4px)}100%{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (min-width:640px){.stage,.top{max-width:600px;width:100%;margin:0 auto}}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-bell" viewBox="0 0 24 24"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 20a2 2 0 0 0 4 0"/><path d="M12 3v2"/></symbol>
  <symbol id="i-book" viewBox="0 0 24 24"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M4 20.5V5.5"/><path d="M20 18v3H6.5"/></symbol>
  <symbol id="i-bolt" viewBox="0 0 24 24"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></symbol>
  <symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><circle cx="17" cy="9" r="2.8"/><path d="M16 15.5a5.5 5.5 0 0 1 5.5 4.5"/></symbol>
  <symbol id="i-cards" viewBox="0 0 24 24"><rect x="7" y="4" width="13" height="16" rx="2"/><path d="M4 8v11a2 2 0 0 0 2 2h10"/></symbol>
  <symbol id="i-note" viewBox="0 0 24 24"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6"/><path d="M8 13h8M8 17h5"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
  <symbol id="i-vol" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16 9a4 4 0 0 1 0 6"/></symbol>
  <symbol id="i-mute" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M17 9l4 6M21 9l-4 6"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
  <symbol id="i-bulb" viewBox="0 0 24 24"><path d="M9 18h6"/><path d="M10 21h4"/><path d="M8.5 14.5A6 6 0 1 1 15.5 14.5c-.8.7-1.5 1.5-1.5 2.5h-4c0-1-.7-1.8-1.5-2.5z"/></symbol>
  <symbol id="i-help" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.4-1 1-1 1.7"/><path d="M12 17h.01"/></symbol>
  <symbol id="i-chev" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></symbol>
  <symbol id="i-shuffle" viewBox="0 0 24 24"><path d="M3 7h3l4 5-4 5H3"/><path d="M14 7h4l3 0M14 17h4l3 0"/><path d="M19 4l3 3-3 3M19 14l3 3-3 3"/><path d="M10 12l4-5M10 12l4 5"/></symbol>
  <symbol id="i-trophy" viewBox="0 0 24 24"><path d="M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M7 6H4a3 3 0 0 0 3 4M17 6h3a3 3 0 0 1-3 4"/><path d="M12 14v4M8 21h8M9 18h6"/></symbol>
</svg>

<div class="app">
  <div class="top">
    <button class="iconbtn" id="btnBack" aria-label="뒤로" hidden><svg class="i"><use href="#i-back"/></svg></button>
    <h2 id="topTitle">도전! 골든벨</h2>
    <button class="iconbtn" id="btnSound" aria-label="소리 켜기/끄기"><svg class="i"><use href="#i-vol"/></svg></button>
  </div>
  <div class="stage" id="stage">

    <!-- HOME -->
    <section class="screen" id="scrHome">
      <div class="hero">
        <div>
          <div class="eyebrow">7과목 · 700문항</div>
          <h1>도전!<br>골든벨</h1>
          <div class="sub">과학 · 국어 · 사회 · 음악 · 미술 · 한국사 · 시사상식</div>
        </div>
        <svg class="i bell" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-bell"/></svg>
      </div>
      <div class="stats">
        <div class="stat"><b id="stSolved">0</b><span>풀어본 문제</span></div>
        <div class="stat"><b id="stAcc">-</b><span>정답률</span></div>
        <div class="stat"><b id="stBest">0</b><span>골든벨 최고 기록</span></div>
      </div>
      <div class="modes">
        <button class="mode gold" data-mode="golden"><span class="ic"><svg class="i"><use href="#i-bell"/></svg></span><span><span class="nm">골든벨 도전</span><span class="ds">7과목 50문제, 기회 3번. 끝까지 살아남으면 골든벨</span></span><span class="arr"><svg class="i"><use href="#i-chev"/></svg></span></button>
        <button class="mode" data-mode="practice"><span class="ic"><svg class="i"><use href="#i-book"/></svg></span><span><span class="nm">과목별 연습</span><span class="ds">과목을 골라 100문제를 차근차근</span></span><span class="arr"><svg class="i"><use href="#i-chev"/></svg></span></button>
        <button class="mode" data-mode="vs"><span class="ic"><svg class="i"><use href="#i-users"/></svg></span><span><span class="nm">친구와 대결</span><span class="ds">한 대의 폰으로 번갈아 풀기</span></span><span class="arr"><svg class="i"><use href="#i-chev"/></svg></span></button>
        <button class="mode" data-mode="wrong"><span class="ic"><svg class="i"><use href="#i-note"/></svg></span><span><span class="nm">오답 노트<span id="wrongCount" class="cnt">0</span></span><span class="ds">틀린 문제만 다시. 맞히면 노트에서 사라집니다</span></span><span class="arr"><svg class="i"><use href="#i-chev"/></svg></span></button>
      </div>
      <div class="credit">문제 출처 · 부천시지역아동센터연합회 「도전! 골든벨 700문항」</div>
      <button class="cta ghost" id="btnInstall" hidden>홈 화면에 앱으로 설치</button>
      <button class="linkbtn" id="btnReset">기록 지우기</button>
    </section>

    <!-- SETUP -->
    <section class="screen" id="scrSetup" hidden>
      <div class="card setrow" id="setSubjectBox">
        <div class="lbl">과목</div>
        <div class="chips" id="chipSubj"></div>

/* ---------- helpers ---------- */
const $ = s=>document.querySelector(s);
const shuffle = a=>{ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const norm = s=>String(s).toLowerCase().replace(/[\s\.\,\!\?\·'"“”‘’\(\)\[\]~\-_:;/]/g,'');
const CHO = ['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
function chosung(s){ return Array.from(s).map(ch=>{ const c=ch.charCodeAt(0); if(c>=0xAC00&&c<=0xD7A3) return CHO[Math.floor((c-0xAC00)/588)]; return ch; }).join(''); }
function candidates(q){
  const c=[String(q.a)];
  String(q.a).split(/[\/,]|또는/).forEach(x=>c.push(x));
  if(q.t==='단답형' && q.e && q.e.length<=16 && !/다\.$|요\.$|니다$/.test(q.e)){
    q.e.replace(/모두 인정|등$/g,'').split(/[\/,·]|또는/).forEach(x=>{ if(x.trim()) c.push(x); });
  }
  c.slice().forEach(x=>{ const m=x.match(/^(.*?)\s*\((.*?)\)\s*$/); if(m){ c.push(m[1]); c.push(m[2]); } });
  return c.map(norm).filter(x=>x.length);
}
function checkShort(q, input){
  const n=norm(input); if(!n) return false;
  const cs=candidates(q);
  if(cs.includes(n)) return true;
  const n2=n.replace(/(입니다|이다|이에요|예요|이요|요|다)$/,'');
  if(cs.includes(n2)) return true;
  return cs.some(c=>c.length>=4 && (n.includes(c)||c.includes(n)) && Math.min(n.length,c.length)/Math.max(n.length,c.length)>=0.6);
}
function distractors(q){
  const pool = DATA.filter(x=>x.t==='단답형' && x.s===q.s && norm(x.a)!==norm(q.a) && String(x.a).length<=12);
  const out=[]; const seen=new Set([norm(q.a)]);
  for(const x of shuffle(pool)){ const k=norm(x.a); if(seen.has(k)) continue; seen.add(k); out.push(String(x.a)); if(out.length===3) break; }
  return out;
}
const answerText = q => q.t==='객관식' ? `${CIRC[q.a-1]} ${q.c[q.a-1]}` : String(q.a);
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),1500); }
function record(q, ok){
  const r = store.ans[q.id] || (store.ans[q.id]={c:0,w:0});
  if(ok){ r.c++; store.wrong = store.wrong.filter(i=>i!==q.id); } else { r.w++; if(!store.wrong.includes(q.id)) store.wrong.push(q.id); }
  save();
}

/* ---------- screens ---------- */
const screens = ['Home','Setup','Quiz','Result'];
let current='Home';
function show(name, title){
  screens.forEach(s=>{ $('#scr'+s).hidden = (s!==name); });
  current=name;
  $('#btnBack').hidden = name==='Home';
  $('#topTitle').textContent = title || '도전! 골든벨';
  $('#stage').scrollTop=0;
  if(name==='Home') renderHome();
}
let confirmLeave=false;
$('#btnBack').addEventListener('click', ()=>{
  if(current==='Quiz' && S && S.answered.length && !confirmLeave){ confirmLeave=true; toast('한 번 더 누르면 그만둡니다'); setTimeout(()=>confirmLeave=false,2000); return; }
  show('Home');
});
function renderSound(){ $('#btnSound').innerHTML = ICON(store.sound?'vol':'mute'); }
$('#btnSound').addEventListener('click', ()=>{ store.sound=!store.sound; save(); renderSound(); toast(store.sound?'소리 켬':'소리 끔'); });
renderSound();

function renderHome(){
  const ids=Object.keys(store.ans); let c=0,w=0; ids.forEach(i=>{ c+=store.ans[i].c; w+=store.ans[i].w; });
  $('#stSolved').textContent = ids.length;
  $('#stAcc').textContent = (c+w)? Math.round(c/(c+w)*100)+'%' : '-';
  $('#stBest').textContent = store.best.golden;
  $('#wrongCount').textContent = store.wrong.length;
}
$('#btnReset').addEventListener('click', e=>{
  if(e.target.dataset.arm){ store={ans:{},wrong:[],best:{golden:0},sound:store.sound}; save(); renderHome(); toast('기록을 지웠습니다'); delete e.target.dataset.arm; e.target.textContent='기록 지우기'; }
  else { e.target.dataset.arm='1'; e.target.textContent='정말 지울까요? 한 번 더 누르면 지워집니다'; setTimeout(()=>{ delete e.target.dataset.arm; e.target.textContent='기록 지우기'; },3000); }
});

/* ---------- setup ---------- */
let setup = {mode:'practice', subj:['전체'], types:['O/X','객관식','단답형'], count:20, order:'shuffle', short:'type'};
(function buildChips(){
  const box=$('#chipSubj');
  ['전체',...SUBJECTS].forEach(s=>{ const b=document.createElement('button'); b.className='chip'+(s==='전체'?' on':''); b.dataset.s=s; b.textContent=s; box.appendChild(b); });
  box.addEventListener('click', e=>{ const b=e.target.closest('.chip'); if(!b) return;
    if(b.dataset.s==='전체'){ setup.subj=['전체']; }
    else { setup.subj = setup.subj.filter(x=>x!=='전체'); if(setup.subj.includes(b.dataset.s)) setup.subj=setup.subj.filter(x=>x!==b.dataset.s); else setup.subj.push(b.dataset.s); if(!setup.subj.length) setup.subj=['전체']; }
    box.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on', setup.subj.includes(c.dataset.s)));
  });
  $('#chipType').addEventListener('click', e=>{ const b=e.target.closest('.chip'); if(!b) return; const t=b.dataset.t;
    if(setup.types.includes(t)){ if(setup.types.length===1){ toast('유형을 하나는 골라야 합니다'); return; } setup.types=setup.types.filter(x=>x!==t); } else setup.types.push(t);
    b.classList.toggle('on', setup.types.includes(t)); });
  const single=(id,key,attr)=>$(id).addEventListener('click', e=>{ const b=e.target.closest('.chip'); if(!b) return; setup[key]=b.dataset[attr]; $(id).querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c===b)); });
  single('#chipCount','count','n'); single('#chipOrder','order','o'); single('#chipShort','short','s');
})();

const MODE_INFO = {
  golden: {title:'골든벨 도전', info:'7과목에서 50문제가 고르게 나옵니다. 틀리면 기회가 하나 줄고, 세 번 틀리면 탈락입니다. 50문제를 끝까지 살아남으면 골든벨이 울립니다.'},
  practice:{title:'과목별 연습', info:'고른 과목의 문제가 모두 나옵니다. O/X, 객관식, 단답형이 섞여 있고 단답형은 직접 입력합니다. 중간에 그만둬도 푼 기록은 남습니다.'},
  vs: {title:'친구와 대결', info:'한 문제씩 번갈아 풉니다. 상대 차례에는 폰을 넘겨 주세요. 문제 수는 두 사람 합산입니다.'},
  wrong:{title:'오답 노트'},
};
document.querySelectorAll('.mode').forEach(b=>b.addEventListener('click', ()=>openMode(b.dataset.mode)));
function openMode(mode){
  setup.mode=mode;
  if(mode==='wrong'){
    if(!store.wrong.length){ toast('아직 틀린 문제가 없습니다'); return; }
    startQuiz({mode:'wrong', list: shuffle(store.wrong.map(i=>byId[i]))}); return;
  }
  const m=MODE_INFO[mode];
  $('#setSubjectBox').hidden = mode==='golden';
  $('#setTypeBox').hidden = mode!=='vs';
  $('#setCountBox').hidden = mode!=='vs';
  $('#setOrderBox').hidden = mode!=='practice';
  $('#setShortBox').hidden = mode!=='vs';
  $('#setVsBox').hidden = mode!=='vs';
  $('#setInfo').hidden = !m.info; $('#setInfo').textContent = m.info||'';
  $('#btnStart').textContent = mode==='golden'?'도전 시작':'시작';
  $('#btnStart').className = 'cta' + (mode==='golden'?' brass':'');
  show('Setup', m.title);
}
$('#btnStart').addEventListener('click', ()=>{
  const mode=setup.mode;
  let pool = DATA.filter(q=> setup.subj.includes('전체') || setup.subj.includes(q.s));
  if(mode==='golden'){
    let list=[]; SUBJECTS.forEach((s,i)=>{ list=list.concat(shuffle(DATA.filter(q=>q.s===s)).slice(0, i<1?8:7)); });
    startQuiz({mode, list:shuffle(list), lives:3}); return;
  }
  if(mode==='vs'){
    pool = pool.filter(q=>setup.types.includes(q.t));
    if(!pool.length){ toast('조건에 맞는 문제가 없습니다'); return; }
    startQuiz({mode, list:shuffle(pool).slice(0,+setup.count), vs:[$('#p1name').value||'1번', $('#p2name').value||'2번']}); return;
  }
  // 과목별 연습: 고른 과목의 모든 문제, 모든 유형. 단답형은 직접 입력.
  startQuiz({mode, list: setup.order==='seq' ? pool : shuffle(pool), short:'type'});
});

/* ---------- quiz engine ---------- */
let S=null;
function startQuiz(opt){
  S = {mode:opt.mode, list:opt.list, i:0, answered:[], lives:opt.lives||0, short:opt.short||setup.short, vs:opt.vs||null, scores:[0,0], hintLevel:0, locked:false};
  show('Quiz', MODE_INFO[opt.mode]?MODE_INFO[opt.mode].title:'퀴즈');
  $('#qHearts').hidden = !S.lives; $('#qCount').hidden = !!S.lives;
  $('#vsBoard').hidden = !S.vs;
  renderQ();
}
function turnOf(){ return S.i%2; }
function renderLives(){ $('#qHearts').innerHTML = [0,1,2].map(k=>`<i class="${k<S.lives?'on':''}"></i>`).join(''); }
function renderQ(){
  const q=S.list[S.i]; if(!q){ finish(); return; }
  S.locked=false; S.hintLevel=0;
  $('#qSubj').textContent = q.s;
  $('#qType').textContent = q.t;
  $('#qCount').textContent = `${S.i+1} / ${S.list.length}`;
  $('#qProg').style.width = (S.i/S.list.length*100)+'%';
  if(S.lives) renderLives();
  $('#qNum').textContent = S.lives ? `${S.i+1}번째 문제 · ${q.s} ${q.n}` : `${q.s} ${String(q.n).padStart(2,'0')}`;
  $('#qText').textContent = q.q;
  $('#qCard').classList.remove('pop','shake'); void $('#qCard').offsetWidth; $('#qCard').classList.add('pop');
  $('#qFeedback').hidden=true; $('#qFeedback').innerHTML=''; $('#qBottom').hidden=true;
  if(S.vs) renderVs();
  const area=$('#qAnswerArea'); area.innerHTML='';
  if(q.t==='O/X'){
    const d=document.createElement('div'); d.className='ox';
    d.innerHTML='<button data-v="O">O<small>맞다</small></button><button data-v="X">X<small>틀리다</small></button>';
    d.querySelectorAll('button').forEach(b=>b.addEventListener('click', ()=>{ if(S.locked) return; const ok=b.dataset.v===q.a; d.querySelectorAll('button').forEach(x=>{ x.disabled=true; if(x.dataset.v===q.a) x.classList.add('ok'); else if(x===b&&!ok) x.classList.add('no'); }); grade(q, ok, b.dataset.v); }));
    area.appendChild(d);
  } else if(q.t==='객관식' || S.short==='pick'){
    let items, correctIdx;
    if(q.t==='객관식'){ items=q.c; correctIdx=q.a-1; }
    else { const ds=distractors(q); items=shuffle([String(q.a),...ds]); correctIdx=items.indexOf(String(q.a)); }
    const d=document.createElement('div'); d.className='opts';
    items.forEach((txt,idx)=>{ const b=document.createElement('button'); b.className='opt'; b.innerHTML=`<span class="k">${idx+1}</span><span></span>`; b.lastChild.textContent=txt;
      b.addEventListener('click', ()=>{ if(S.locked) return; const ok=idx===correctIdx; d.querySelectorAll('.opt').forEach((x,j)=>{ x.disabled=true; if(j===correctIdx) x.classList.add('ok'); else if(x===b&&!ok) x.classList.add('no'); }); grade(q, ok, txt); });
      d.appendChild(b); });
    area.appendChild(d);
  } else {
    const d=document.createElement('div'); d.className='setrow';
    d.innerHTML=`<div class="inputrow"><input id="shortIn" type="text" autocomplete="off" autocapitalize="off" enterkeyhint="done" placeholder="정답 입력" aria-label="정답 입력"><button id="shortGo">확인</button></div>
      <div class="hint" id="hintBox" hidden></div>
      <div class="subrow"><button class="small" id="btnHint">${ICON('bulb')}초성 힌트</button><button class="small" id="btnGiveup">${ICON('help')}정답 보기</button></div>`;
    area.appendChild(d);
    const inp=d.querySelector('#shortIn');
    const submit=()=>{ if(S.locked) return; const v=inp.value.trim(); if(!v){ inp.focus(); return; } inp.disabled=true; grade(q, checkShort(q,v), v, true); };
    d.querySelector('#shortGo').addEventListener('click', submit);
    inp.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); submit(); } });
    d.querySelector('#btnHint').addEventListener('click', ()=>{ if(S.locked) return; S.hintLevel++; const a=String(q.a).replace(/\s*\(.*\)$/,''); const ch=chosung(a); const box=d.querySelector('#hintBox'); box.hidden=false;
      box.textContent = S.hintLevel===1 ? ch : Array.from(a).map((c,i)=> i<S.hintLevel-1 ? c : ch[i]).join('');
      if(S.hintLevel-1>=a.length-1) d.querySelector('#btnHint').disabled=true; });
    d.querySelector('#btnGiveup').addEventListener('click', ()=>{ if(S.locked) return; inp.disabled=true; grade(q,false,'',false); });
    if(!S.vs) setTimeout(()=>inp.focus({preventScroll:true}),50);
  }
}
function renderVs(){
  const t=turnOf();
  $('#vsBoard').innerHTML = `<div class="p ${t===0?'turn':''}"><b>${S.scores[0]}</b><span></span></div><em>VS</em><div class="p ${t===1?'turn':''}"><b>${S.scores[1]}</b><span></span></div>`;
  const sp=$('#vsBoard').querySelectorAll('span'); sp[0].textContent=S.vs[0]; sp[1].textContent=S.vs[1];
  $('#qNum').textContent = `${S.vs[t]} 차례 · ${S.list[S.i].s}`;
}
function grade(q, ok, given, allowSelf){
  S.locked=true;
  const fb=$('#qFeedback'); fb.hidden=false; fb.className='fb '+(ok?'ok':'no');
  const head = ok ? ICON('check')+'정답' : (given==='' ? '정답 확인' : ICON('x')+'오답');
  fb.innerHTML = `<h3>${head}</h3><div class="ans">정답 <b></b></div>${q.e?`<div class="exp"></div>`:''}`;
  fb.querySelector('.ans b').textContent=answerText(q);
  if(q.e) fb.querySelector('.exp').textContent=q.e;
  if(!ok && allowSelf && given){
    const sg=document.createElement('div'); sg.className='selfgrade';
    sg.innerHTML=`<div class="mine">내 답 · <b></b></div><button id="selfOk">같은 뜻이면 정답 처리</button>`;
    sg.querySelector('b').textContent=given;
    sg.querySelector('#selfOk').addEventListener('click', ()=>{ sg.remove(); undoLast(q); applyResult(q,true); fb.className='fb ok'; fb.querySelector('h3').innerHTML=ICON('check')+'정답으로 인정'; });
    fb.appendChild(sg);
  }
  applyResult(q, ok);
  $('#qCard').classList.add(ok?'pop':'shake');
  const last = (S.mode==='golden' && S.lives<=0) || S.i+1>=S.list.length;
  $('#btnNext').textContent = last ? '결과 보기' : '다음 문제';
  $('#qBottom').hidden=false;
  $('#btnNext').focus({preventScroll:true});
}
function applyResult(q, ok){
  S.answered.push({id:q.id, ok});
  record(q, ok);
  if(S.vs && ok) S.scores[turnOf()]++;
  if(S.mode==='golden' && !ok){ S.lives=Math.max(0,S.lives-1); renderLives(); }
  if(S.vs) renderVs();
  beep(ok?'ok':'no');
}
function undoLast(q){
  const last=S.answered.pop(); if(!last) return;
  const r=store.ans[q.id]; if(r){ r.w=Math.max(0,r.w-1); }
  if(S.mode==='golden'){ S.lives=Math.min(3,S.lives+1); renderLives(); }
}
$('#btnNext').addEventListener('click', next);
function next(){
  if(!S) return;
  if(S.mode==='golden' && S.lives<=0){ finish(); return; }
  S.i++;
  if(S.i>=S.list.length){ finish(); return; }
  renderQ();
}
function finish(){
  const total=S.answered.length, c=S.answered.filter(a=>a.ok).length;
  const wrongIds=S.answered.filter(a=>!a.ok).map(a=>a.id);
  let head='';
  const TAG = t=>`<div class="tag">${t}</div>`;
  if(S.mode==='golden'){
    const survived = S.lives>0 && total>=S.list.length;
    if(survived){ head=`<svg class="i bellbig" viewBox="0 0 24 24"><use href="#i-bell"/></svg><div class="msg">골든벨을 울렸습니다</div><div class="muted">50문제 중 ${c}문제 정답</div>`; beep('bell'); }
    else head=`<div class="big">${total}<small> / 50</small></div><div class="msg">${total}번째 문제에서 탈락</div><div class="muted">정답 ${c}문제</div>`;
    if(total>store.best.golden){ store.best.golden=total; save(); head+=TAG('최고 기록'); }
  } else {
    const pct = total? Math.round(c/total*100):0;
    const msg = pct===100?'모두 맞혔습니다':pct>=80?'거의 다 맞혔습니다':pct>=60?'잘했습니다. 조금만 더':'틀린 문제를 다시 보면 금방 늡니다';
    head=`<div class="big">${c}<small> / ${total}</small></div><div class="msg">${msg}</div><div class="muted">정답률 ${pct}%</div>`;
    if(pct===100 && total>0) beep('bell');
  }
  $('#resScore').innerHTML=head;
  if(S.vs){
    const [a,b]=S.scores; const win = a===b?'무승부':(a>b?S.vs[0]:S.vs[1])+' 승리';
    $('#resVs').hidden=false; $('#resVs').innerHTML=`<div class="vs"><div class="p ${a>=b?'turn':''}"><b>${a}</b><span></span></div><em>VS</em><div class="p ${b>=a?'turn':''}"><b>${b}</b><span></span></div></div><div class="turnbanner" style="margin-top:10px"></div>`;
    const sp=$('#resVs').querySelectorAll('span'); sp[0].textContent=S.vs[0]; sp[1].textContent=S.vs[1]; $('#resVs').querySelector('.turnbanner').textContent=win;
  } else $('#resVs').hidden=true;
  const per={}; S.answered.forEach(a=>{ const q=byId[a.id]; per[q.s]=per[q.s]||{c:0,t:0}; per[q.s].t++; if(a.ok) per[q.s].c++; });
  const keys=SUBJECTS.filter(s=>per[s]);
  $('#resBars').hidden = keys.length<2;
  $('#resBars').innerHTML='<div class="lbl" style="margin-bottom:10px">과목별 정답</div><div class="bars">'+keys.map(s=>`<div class="bar"><span>${s}</span><i><b style="width:${per[s].c/per[s].t*100}%"></b></i><span>${per[s].c}/${per[s].t}</span></div>`).join('')+'</div>';
  $('#btnRetryWrong').hidden = !wrongIds.length;
  $('#btnRetryWrong').onclick = ()=>startQuiz({mode:'wrong', list:shuffle(wrongIds.map(i=>byId[i]))});
  $('#btnAgain').onclick = ()=>{ if(S_mode==='wrong'){ if(store.wrong.length) startQuiz({mode:'wrong', list:shuffle(store.wrong.map(i=>byId[i]))}); else show('Home'); } else { setup.mode=S_mode; $('#btnStart').click(); } };
  $('#resWrongLbl').hidden = !wrongIds.length;
  $('#resWrong').innerHTML = wrongIds.map(()=>`<div class="wrongitem"><div class="m"></div><div class="qq"></div><div class="a"></div><div class="m ee" hidden></div></div>`).join('');
  $('#resWrong').querySelectorAll('.wrongitem').forEach((el,k)=>{ const q=byId[wrongIds[k]]; el.querySelector('.m').textContent=`${q.s} ${q.n} · ${q.t}`; el.querySelector('.qq').textContent=q.q; el.querySelector('.a').textContent='정답 '+answerText(q); if(q.e){ el.querySelector('.ee').hidden=false; el.querySelector('.ee').textContent=q.e; } });
  const S_mode=S.mode; S=null;
  show('Result', S_mode==='golden'?'골든벨 결과':'결과');
}
$('#btnHome').addEventListener('click', ()=>show('Home'));


/* ---------- PWA ---------- */
(function(){
  if('serviceWorker' in navigator){ window.addEventListener('load', ()=>{ navigator.serviceWorker.register('./sw.js').catch(()=>{}); }); }
  let deferred=null; const btn=document.getElementById('btnInstall');
  const standalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone===true;
  window.addEventListener('beforeinstallprompt', e=>{ e.preventDefault(); deferred=e; if(!standalone) btn.hidden=false; });
  btn.addEventListener('click', async ()=>{ if(!deferred) return; deferred.prompt(); try{ await deferred.userChoice; }catch(e){} deferred=null; btn.hidden=true; });
  window.addEventListener('appinstalled', ()=>{ btn.hidden=true; toast('설치되었습니다'); });
})();

/* ---------- boot ---------- */
function start(){ show('Home'); }
try{ window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(); }catch(e){ start(); }
